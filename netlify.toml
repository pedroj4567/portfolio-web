[build]
  command = "pnpm build"
  publish = "dist"

# 404 in English for routes under /en/ (the global 404 is dist/404.html, in Spanish).
[[redirects]]
  from = "/en/*"
  to = "/en/404/"
  status = 404

# 301 redirects for renamed URLs (e.g. the old pacostadev.netlify.app portfolio)
# go ABOVE the 404 rules. Example:
# [[redirects]]
#   from = "/portfolio"
#   to = "/es/proyectos/"
#   status = 301

# Long cache for hashed assets (Astro adds a hash to /_astro/*).
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
